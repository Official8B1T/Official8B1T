<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
                style='isolation: isolate' viewBox='0 0 846 210' width='846px' height='210px' direction='ltr'>
        <style>
            @keyframes currstreak {
                0% { font-size: 3px; opacity: 0.2; }
                80% { font-size: 34px; opacity: 1; }
                100% { font-size: 28px; opacity: 1; }
            }
            @keyframes fadein {
                0% { opacity: 0; }
                100% { opacity: 1; }
            }
        </style>
        <defs>
            <clipPath id='outer_rectangle'>
                <rect width='846' height='210' rx='8'/>
            </clipPath>
            <mask id='mask_out_ring_behind_fire'>
                <rect width='846' height='210' fill='white'/>
                <ellipse id='mask-ellipse' cx='423' cy='32' rx='13' ry='18' fill='black'/>
            </mask>
            
        </defs>
        <g clip-path='url(#outer_rectangle)'>
            <g style='isolation: isolate'>
                <rect stroke='#242424' fill='#080808' rx='8' x='0.5' y='0.5' width='845' height='209'/>
            </g>
            <g style='isolation: isolate'>
                <line x1='282' y1='31.75' x2='282' y2='177.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#242424' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
                <line x1='564' y1='31.75' x2='564' y2='177.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#242424' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
            </g>
            <g style='isolation: isolate'>
                <!-- Total Contributions big number -->
                <g transform='translate(141, 55.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#ffffff' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>
                        1,174
                    </text>
                </g>

                <!-- Total Contributions label -->
                <g transform='translate(141, 91.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#f5f2ef' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.7s'>
                        Total Contributions
                    </text>
                </g>

                <!-- Total Contributions range -->
                <g transform='translate(141, 121.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#818181' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.8s'>
                        29 May 2025 - Present
                    </text>
                </g>
            </g>
            <g style='isolation: isolate'>
                <!-- Current Streak label -->
                <g transform='translate(423, 115.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#ff0000' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>
                        Week Streak
                    </text>
                </g>

                <!-- Current Streak range -->
                <g transform='translate(423, 152.5)'>
                    <text x='0' y='21' stroke-width='0' text-anchor='middle' fill='#818181' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>
                        2 Aug - 8 Nov
                    </text>
                </g>

                <!-- Ring around number -->
                <g mask='url(#mask_out_ring_behind_fire)'>
                    <circle cx='423' cy='78.5' r='40' fill='none' stroke='#ff0000' stroke-width='5' style='opacity: 0; animation: fadein 0.5s linear forwards 0.4s'></circle>
                </g>
                <!-- Fire icon -->
                <g transform='translate(423, 27)' stroke-opacity='0' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>
                    <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none'/>
                    <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#ff0000' stroke-opacity='0'/>
                </g>

                <!-- Current Streak big number -->
                <g transform='translate(423, 55.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#ffffff' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='animation: currstreak 0.6s linear forwards'>
                        15
                    </text>
                </g>

            </g>
            <g style='isolation: isolate'>
                <!-- Longest Streak big number -->
                <g transform='translate(705, 55.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#ffffff' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.2s'>
                        15
                    </text>
                </g>

                <!-- Longest Streak label -->
                <g transform='translate(705, 91.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#f5f2ef' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='14px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.3s'>
                        Longest Week Streak
                    </text>
                </g>

                <!-- Longest Streak range -->
                <g transform='translate(705, 121.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#818181' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.4s'>
                        2 Aug - 8 Nov
                    </text>
                </g>
            </g>
            
        </g>
    </svg>
